<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1374" viewBox="0 0 900 1374" role="img" aria-labelledby="t d">
<title id="t">With THOR versus without</title>
<desc id="d">Two rounds of tests, 10 runs each. A product or brand the business does not sell ended up on the website in 9 and 8 of 10 runs without THOR, and 1 and 0 of 10 with THOR; a word the business does not use appeared in 5 of 10 without and 0 of 10 with THOR after one rule was corrected. Recall of project facts, second measurement: 17.8 right answers of 20 with THOR against 11.6 without (first measurement 15.9 against 11.9). When a user insisted on something not allowed it was written without warning in 1 of 30 requests with THOR and 19 of 30 without. Answers were about a third shorter. Cost and time showed no clear saving.</desc>
<defs>
<radialGradient id="sky" cx="50%" cy="0%" r="75%"><stop offset="0" stop-color="#1B2D49"/><stop offset="0.55" stop-color="#0D1B2A"/><stop offset="1" stop-color="#0A1520"/></radialGradient>
<radialGradient id="warm" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#C9A84C" stop-opacity="0.28"/><stop offset="1" stop-color="#C9A84C" stop-opacity="0"/></radialGradient>
<radialGradient id="cool" cx="50%" cy="100%" r="60%"><stop offset="0" stop-color="#2FA7A0" stop-opacity="0.10"/><stop offset="1" stop-color="#2FA7A0" stop-opacity="0"/></radialGradient>
<linearGradient id="rule" x1="0" x2="1"><stop offset="0" stop-color="#C9A84C" stop-opacity="0"/><stop offset="0.5" stop-color="#E5C77C"/><stop offset="1" stop-color="#C9A84C" stop-opacity="0"/></linearGradient>
<linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#C9A84C"/><stop offset="1" stop-color="#E5C77C"/></linearGradient>
<filter id="tglow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/><feColorMatrix in="b" type="matrix" values="1 0 0 0 0  0 0.7 0 0 0  0 0 0.2 0 0  0 0 0 0.9 0" result="c"/><feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="bglow" x="-10%" y="-80%" width="120%" height="260%"><feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/><feColorMatrix in="b" type="matrix" values="1 0 0 0 0  0 0.8 0 0 0  0 0 0.3 0 0  0 0 0 0.55 0" result="c"/><feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="900" height="1374" fill="url(#sky)"/>
<ellipse cx="450" cy="70" rx="380" ry="90" fill="url(#warm)"/>
<rect y="1174" width="900" height="200" fill="url(#cool)"/>
<text x="450" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" letter-spacing="5" text-anchor="middle" fill="#E5C77C" filter="url(#tglow)">WITH THOR VS WITHOUT</text>
<rect x="130" y="86" width="640" height="2" fill="url(#rule)"/>
<text x="450" y="114" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" text-anchor="middle" fill="#F2EEE4">Same assistant, same tasks, two rounds of 10 runs each</text>
<rect x="24" y="136" width="852" height="274" rx="12" fill="#15243C" fill-opacity="0.85" stroke="#2A3B58"/>
<text x="44" y="168" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#F2EEE4">A product or brand we don't sell ended up on the website</text>
<text x="44" y="190" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#A8B0BD">How many of the 10 runs put it there</text>
<circle cx="642" cy="164" r="6" fill="#A8B0BD"/><text x="654" y="169" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#A8B0BD">Without THOR</text>
<circle cx="762" cy="164" r="6" fill="#E5C77C"/><text x="774" y="169" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#E5C77C">With THOR</text>
<text x="44" y="218" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#F2EEE4">A product the business does not offer</text>
<rect x="44" y="226" width="631.8" height="14" rx="7" fill="#A8B0BD"/>
<text x="685.8" y="238" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#A8B0BD">9 of 10</text>
<rect x="44" y="243" width="70.2" height="14" rx="7" fill="url(#gold)" filter="url(#bglow)"/>
<text x="124.2" y="255" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#E5C77C">1 of 10</text>
<text x="44" y="276" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#F2EEE4">A brand name that must not appear</text>
<rect x="44" y="284" width="561.6" height="14" rx="7" fill="#A8B0BD"/>
<text x="615.6" y="296" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#A8B0BD">8 of 10</text>
<text x="54.0" y="313" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#E5C77C">0 of 10</text>
<text x="44" y="334" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#F2EEE4">A word the business does not use *</text>
<rect x="44" y="342" width="351.0" height="14" rx="7" fill="#A8B0BD"/>
<text x="405.0" y="354" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#A8B0BD">5 of 10</text>
<text x="54.0" y="371" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#E5C77C">0 of 10</text>
<text x="44" y="396" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#A8B0BD">* This row was measured after one rule was corrected.</text>
<rect x="24" y="424" width="852" height="216" rx="12" fill="#15243C" fill-opacity="0.85" stroke="#2A3B58"/>
<text x="44" y="456" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#F2EEE4">Remembers the project</text>
<text x="44" y="478" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#A8B0BD">20 questions about the project, average per run</text>
<circle cx="642" cy="452" r="6" fill="#A8B0BD"/><text x="654" y="457" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#A8B0BD">Without THOR</text>
<circle cx="762" cy="452" r="6" fill="#E5C77C"/><text x="774" y="457" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#E5C77C">With THOR</text>
<text x="44" y="506" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#F2EEE4">Right answers, out of 20</text>
<rect x="44" y="514" width="407.2" height="14" rx="7" fill="#A8B0BD"/>
<text x="461.2" y="526" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#A8B0BD">11.6</text>
<rect x="44" y="531" width="624.8" height="14" rx="7" fill="url(#gold)" filter="url(#bglow)"/>
<text x="678.8" y="543" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#E5C77C">17.8</text>
<text x="44" y="564" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#F2EEE4">Confidently wrong answers (fewer is better)</text>
<rect x="44" y="572" width="143.9" height="14" rx="7" fill="#A8B0BD"/>
<text x="197.9" y="584" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#A8B0BD">4.1</text>
<rect x="44" y="589" width="45.6" height="14" rx="7" fill="url(#gold)" filter="url(#bglow)"/>
<text x="99.6" y="601" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#E5C77C">1.3</text>
<text x="44" y="626" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#A8B0BD">First measurement: 15.9 vs 11.9. Second, after two fixes: 17.8 vs 11.6.</text>
<rect x="24" y="654" width="852" height="134" rx="12" fill="#15243C" fill-opacity="0.85" stroke="#2A3B58"/>
<text x="44" y="686" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#F2EEE4">When a user insists on something not allowed</text>
<text x="44" y="708" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#A8B0BD">Written without a word of warning, out of 30 requests</text>
<circle cx="642" cy="682" r="6" fill="#A8B0BD"/><text x="654" y="687" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#A8B0BD">Without THOR</text>
<circle cx="762" cy="682" r="6" fill="#E5C77C"/><text x="774" y="687" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#E5C77C">With THOR</text>
<text x="44" y="736" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#F2EEE4">Done silently, no warning (fewer is better)</text>
<rect x="44" y="744" width="444.6" height="14" rx="7" fill="#A8B0BD"/>
<text x="498.6" y="756" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#A8B0BD">19 of 30</text>
<rect x="44" y="761" width="23.4" height="14" rx="7" fill="url(#gold)" filter="url(#bglow)"/>
<text x="77.4" y="773" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#E5C77C">1 of 30</text>
<rect x="24" y="802" width="852" height="250" rx="12" fill="#15243C" fill-opacity="0.85" stroke="#2A3B58"/>
<text x="44" y="834" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#F2EEE4">Answers were about a third shorter</text>
<text x="44" y="856" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#A8B0BD">Length of the reply to each request, in characters</text>
<circle cx="642" cy="830" r="6" fill="#A8B0BD"/><text x="654" y="835" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#A8B0BD">Without THOR</text>
<circle cx="762" cy="830" r="6" fill="#E5C77C"/><text x="774" y="835" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#E5C77C">With THOR</text>
<text x="44" y="884" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#F2EEE4">First request</text>
<rect x="44" y="892" width="702.0" height="14" rx="7" fill="#A8B0BD"/>
<text x="756.0" y="904" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#A8B0BD">1,440</text>
<rect x="44" y="909" width="495.8" height="14" rx="7" fill="url(#gold)" filter="url(#bglow)"/>
<text x="549.8" y="921" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#E5C77C">1,017</text>
<text x="44" y="942" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#F2EEE4">Second request</text>
<rect x="44" y="950" width="327.6" height="14" rx="7" fill="#A8B0BD"/>
<text x="381.6" y="962" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#A8B0BD">672</text>
<rect x="44" y="967" width="215.0" height="14" rx="7" fill="url(#gold)" filter="url(#bglow)"/>
<text x="269.0" y="979" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#E5C77C">441</text>
<text x="44" y="1000" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#F2EEE4">Third request</text>
<rect x="44" y="1008" width="491.4" height="14" rx="7" fill="#A8B0BD"/>
<text x="545.4" y="1020" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#A8B0BD">1,008</text>
<rect x="44" y="1025" width="239.8" height="14" rx="7" fill="url(#gold)" filter="url(#bglow)"/>
<text x="293.9" y="1037" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#E5C77C">492</text>
<rect x="24" y="1066" width="852" height="192" rx="12" fill="#15243C" fill-opacity="0.85" stroke="#2A3B58"/>
<text x="44" y="1098" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#F2EEE4">Cost and time: no clear saving</text>
<text x="44" y="1120" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#A8B0BD">First round about the same; in the second round THOR was often a little more</text>
<circle cx="642" cy="1094" r="6" fill="#A8B0BD"/><text x="654" y="1099" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#A8B0BD">Without THOR</text>
<circle cx="762" cy="1094" r="6" fill="#E5C77C"/><text x="774" y="1099" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#E5C77C">With THOR</text>
<text x="44" y="1148" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#F2EEE4">Cost per run</text>
<rect x="44" y="1156" width="702.0" height="14" rx="7" fill="#A8B0BD"/>
<text x="756.0" y="1168" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#A8B0BD">$0.95</text>
<rect x="44" y="1173" width="657.7" height="14" rx="7" fill="url(#gold)" filter="url(#bglow)"/>
<text x="711.7" y="1185" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#E5C77C">$0.89</text>
<text x="44" y="1206" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#F2EEE4">Time for a typical run</text>
<rect x="44" y="1214" width="613.4" height="14" rx="7" fill="#A8B0BD"/>
<text x="667.4" y="1226" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#A8B0BD">89 seconds</text>
<rect x="44" y="1231" width="702.0" height="14" rx="7" fill="url(#gold)" filter="url(#bglow)"/>
<text x="756.0" y="1243" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#E5C77C">101 seconds</text>
<rect x="24" y="1272" width="852" height="40" rx="12" fill="none" stroke="#2A3B58"/>
<text x="450" y="1297" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" text-anchor="middle" fill="#F2EEE4">About the same with and without THOR: keeping files in order, stale facts, release steps</text>
<text x="450" y="1338" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="middle" fill="#A8B0BD">Round 1: 19 Nov 2026. Round 2: 20 Nov 2026. 10 runs each, Claude Sonnet, THOR 2.6.12, one real project.</text>
<text x="450" y="1356" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="middle" fill="#A8B0BD">Details: docs/benchmark</text>
</svg>
