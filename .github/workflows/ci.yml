# CI: prove THOR builds and passes its tests on a CLEAN machine - not just on
# the maintainer's. That is the whole point; everything else is style.
#
# Both feature sets are built because both are shipped:
#   default             = pure bm25, no ONNX. What the NAS/server build runs.
#   --features semantic = the dense score-fusion client path.
# A change that only compiles under one of them is broken, so both gate.
#
# NOT gated here (deliberately, so this stays honest rather than decorative):
# rustfmt and clippy. The tree is not currently clean under either, and running
# `cargo fmt` across it would churn every file for no behaviour change. See
# CONTRIBUTING.md - match the local style in your diff instead.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Version 1 had its own build-and-test job here until 2026-08-15. Version 1 is
  # retired: its source is no longer in this tree, and the v1.0.0 tag still holds
  # it for anyone who needs to look. A job that builds a directory nobody ships
  # is a job that only ever fails.
  #
  # `--all-targets`, not `--lib`: 2.0 puts the refusals it cares most about in
  # integration tests (the write path, the neighbourhood toll, the global tier)
  # and those are exactly the ones a regression would break quietly.
  thor2:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The server/NAS shape: no ONNX, so the semantic path degrades to
          # literal search. Everything else has to keep working.
          - name: thor2 / linux (default)
            os: ubuntu-latest
            features: ""
            smoke_semantic: "no"
          # The client shape, and the one the owner actually runs.
          - name: thor2 / windows (semantic)
            os: windows-latest
            features: "--features semantic"
            smoke_semantic: "yes"

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: thor2

      - name: Build
        working-directory: thor2
        run: cargo build --release ${{ matrix.features }}

      # No embedding model and no store on a clean runner, which is the point:
      # every one of these has to pass without either. Measured 2026-08-08:
      # 1137 tests across 78 binaries.
      - name: Test
        working-directory: thor2
        # --no-fail-fast: one run shows every failing test binary, not only the
        # first, so a fix is not found out one push at a time.
        run: cargo test --release ${{ matrix.features }} --all-targets --no-fail-fast

      # The same new-user walk the release runs on each packaged archive, here on
      # every push, so a tag never meets it for the first time. The programs
      # are the ones the Build step made; the test itself checks that this list
      # still equals SHIPPED_BINS in release.yml.
      - name: Smoke test (the built programs, like a new user)
        shell: bash
        working-directory: thor2
        run: |
          mkdir -p "$GITHUB_WORKSPACE/smoke-bin"
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          for b in install doctor serve mcp codeindex backup sync migrate backfill_teeth; do
            cp "target/release/$b$ext" "$GITHUB_WORKSPACE/smoke-bin/"
          done
          THOR_SMOKE_BIN_DIR="$GITHUB_WORKSPACE/smoke-bin" \
          THOR_SMOKE_SEMANTIC="${{ matrix.smoke_semantic }}" \
            cargo test --release ${{ matrix.features }} -p ops --test release_smoke -- --ignored --nocapture

  # This repository is public and its test fixtures are written while looking at
  # the maintainer's real, private memory store - so private identifiers leak in
  # by default, not by accident. A full history rewrite on 2026-07-23 scrubbed
  # them; three days later the same class was back. Hence a gate rather than a
  # rule. Cheap, and the only alternative after a push is another rewrite.
  private-data:
    name: no private identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files
        run: sh scripts/check-private-data.sh

  # A version bump with nothing to say about it is not a release. This catches
  # the gap on the push that bumps thor2/Cargo.toml, before a tag ever exists -
  # cheaper than finding out from the release workflow's own refusal.
  changelog:
    name: changelog has a section for the current version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: sh scripts/changelog-check.sh
